<script>
(function(){
  "use strict";

  // ---- image compression so frames fit Firestore's 1MB doc limit ----
  window.fileToDataURL = function(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var maxDim = 1400;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var q = 0.85, url = c.toDataURL('image/jpeg', q);
        while(url.length > 950000 && q > 0.4){ q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(img.src);
        resolve(url);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  };

  function sortPanels(arr){
    return arr.slice().sort(function(a,b){
      if(a.section !== b.section) return (SECTION_ORDER[a.section]||0) - (SECTION_ORDER[b.section]||0);
      return (a.order||0) - (b.order||0);
    });
  }
  window.SECTION_ORDER = { seq00:0, act1:1, act2:2, act3:3, act4:4, coda:5 };
  var SECTION_ORDER = window.SECTION_ORDER;

  // ---------------- Firestore-backed store ----------------
  function FirestoreStore(){
    firebase.initializeApp(window.FIREBASE_CONFIG);
    this.db = firebase.firestore();
    this.col = this.db.collection('panels');
  }
  FirestoreStore.prototype.mode = 'live';
  FirestoreStore.prototype.seedIfEmpty = function(defaults){
    var db = this.db, col = this.col;
    var metaRef = db.collection('_meta').doc('board');
    return db.runTransaction(function(tx){
      return tx.get(metaRef).then(function(m){
        if(m.exists && m.data().seeded) return;
        defaults.forEach(function(p){ tx.set(col.doc(p.id), p); });
        tx.set(metaRef, { seeded:true, ts: Date.now() });
      });
    });
  };
  FirestoreStore.prototype.subscribe = function(cb){
    return this.col.onSnapshot(function(snap){
      var arr = []; snap.forEach(function(d){ arr.push(d.data()); });
      cb(sortPanels(arr));
    });
  };
  FirestoreStore.prototype.update = function(id, patch){ return this.col.doc(id).set(patch, {merge:true}); };
  FirestoreStore.prototype.add = function(panel){ return this.col.doc(panel.id).set(panel); };
  FirestoreStore.prototype.remove = function(id){ return this.col.doc(id).delete(); };
  FirestoreStore.prototype.addComment = function(id, comment){
    return this.col.doc(id).update({ comments: firebase.firestore.FieldValue.arrayUnion(comment) });
  };

  // ---------------- localStorage demo store (cross-tab live via BroadcastChannel) ----------------
  function LocalStore(){
    this.KEY = 'keeper-board-v1';
    this.listeners = [];
    var self = this;
    try { this.bc = new BroadcastChannel('keeper-board'); this.bc.onmessage = function(){ self._emit(); }; } catch(e){ this.bc = null; }
    window.addEventListener('storage', function(e){ if(e.key === self.KEY) self._emit(); });
  }
  LocalStore.prototype.mode = 'local';
  LocalStore.prototype._read = function(){ try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch(e){ return {}; } };
  LocalStore.prototype._write = function(obj){ localStorage.setItem(this.KEY, JSON.stringify(obj)); if(this.bc) this.bc.postMessage(1); this._emit(); };
  LocalStore.prototype._emit = function(){ var arr = sortPanels(Object.values(this._read())); this.listeners.forEach(function(cb){ cb(arr); }); };
  LocalStore.prototype.seedIfEmpty = function(defaults){
    var obj = this._read();
    if(Object.keys(obj).length === 0){ defaults.forEach(function(p){ obj[p.id] = p; }); this._write(obj); }
    return Promise.resolve();
  };
  LocalStore.prototype.subscribe = function(cb){ this.listeners.push(cb); this._emit(); var self=this; return function(){ self.listeners = self.listeners.filter(function(f){ return f!==cb; }); }; };
  LocalStore.prototype.update = function(id, patch){ var o=this._read(); o[id]=Object.assign({}, o[id], patch); this._write(o); return Promise.resolve(); };
  LocalStore.prototype.add = function(panel){ var o=this._read(); o[panel.id]=panel; this._write(o); return Promise.resolve(); };
  LocalStore.prototype.remove = function(id){ var o=this._read(); delete o[id]; this._write(o); return Promise.resolve(); };
  LocalStore.prototype.addComment = function(id, comment){ var o=this._read(); var p=o[id]; if(!p) return Promise.resolve(); p.comments=(p.comments||[]).concat([comment]); this._write(o); return Promise.resolve(); };

  var cfg = window.FIREBASE_CONFIG || {};
  var hasConfig = cfg.apiKey && cfg.projectId;
  window.KeeperStore = hasConfig ? new FirestoreStore() : new LocalStore();
})();
</script>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useRef, useCallback } = React;
const store = window.KeeperStore;
const MODES = window.MODES;
const SECTIONS = window.SECTIONS;

const STATUS = {
  todo:      { label:'TO DO',      hex:'#9AA3AD', bg:'#1c1f23' },
  approved:  { label:'APPROVED',   hex:'#5FCF8E', bg:'#13241a' },
  needswork: { label:'NEEDS WORK', hex:'#E8804C', bg:'#2a1c12' }
};
const STATUS_CYCLE = ['todo','approved','needswork'];

function ago(ts){
  const s = (Date.now() - ts) / 1000;
  if(s < 60) return 'just now';
  const m = s/60; if(m < 60) return Math.floor(m)+'m ago';
  const h = m/60; if(h < 24) return Math.floor(h)+'h ago';
  return Math.floor(h/24)+'d ago';
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function useAuthor(){
  const [name, setName] = useState(() => localStorage.getItem('keeper-author') || '');
  const save = (n) => { localStorage.setItem('keeper-author', n); setName(n); };
  return [name, save];
}

// Auto-growing textarea that only accepts remote updates while unfocused (no cursor jump)
function EditableText({ value, onCommit, style, placeholder }){
  const [val, setVal] = useState(value || '');
  const focused = useRef(false);
  const ref = useRef(null);
  useEffect(() => { if(!focused.current) setVal(value || ''); }, [value]);
  useEffect(() => { const el = ref.current; if(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }, [val]);
  return (
    <textarea
      ref={ref} className="edit" rows={1} value={val} placeholder={placeholder}
      onFocus={() => { focused.current = true; }}
      onBlur={() => { focused.current = false; if((value || '') !== val) onCommit(val); }}
      onChange={(e) => setVal(e.target.value)}
      style={style}
    />
  );
}

function Chip({ value, onCommit }){
  const [val, setVal] = useState(value || '');
  const focused = useRef(false);
  useEffect(() => { if(!focused.current) setVal(value || ''); }, [value]);
  return (
    <input className="chip" value={val}
      onFocus={() => focused.current = true}
      onBlur={() => { focused.current = false; if((value||'') !== val) onCommit(val); }}
      onChange={(e) => setVal(e.target.value)} />
  );
}

function ImageArea({ panel }){
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  const handleFiles = async (files) => {
    const file = [...files].find(f => f.type.startsWith('image/'));
    if(!file) return;
    setBusy(true);
    try { const url = await window.fileToDataURL(file); await store.update(panel.id, { image: url }); }
    catch(e){ alert('Could not read that image.'); }
    setBusy(false);
  };

  return (
    <div
      className={'imgwrap' + (drag ? ' drag' : '')}
      onClick={() => fileRef.current && fileRef.current.click()}
      onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={(e) => { e.preventDefault(); setDrag(false); handleFiles(e.dataTransfer.files); }}
    >
      {panel.image
        ? <img src={panel.image} alt={panel.code} />
        : <div className="imghint">{busy ? 'PROCESSING…' : ('DROP / CLICK TO ADD FRAME · ' + panel.code)}</div>}
      <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }}
        onChange={(e) => handleFiles(e.target.files)} />
      <div className="mono" style={{ position:'absolute', top:11, left:11, fontSize:12, fontWeight:500, letterSpacing:'.06em', color:'#fff', background:'rgba(8,6,4,0.72)', backdropFilter:'blur(3px)', padding:'5px 9px', borderRadius:3 }}>{panel.code}</div>
      {panel.image &&
        <div className="imgtools" onClick={(e) => e.stopPropagation()}>
          <button className="imgbtn" onClick={() => fileRef.current.click()}>REPLACE</button>
          <button className="imgbtn" onClick={() => store.update(panel.id, { image: null })}>REMOVE</button>
        </div>}
    </div>
  );
}

function Comments({ panel, author, requireName }){
  const [text, setText] = useState('');
  const list = panel.comments || [];
  const post = () => {
    const t = text.trim(); if(!t) return;
    if(!author){ requireName(); return; }
    store.addComment(panel.id, { id: uid(), text: t, author, ts: Date.now() });
    setText('');
  };
  return (
    <details className="cmt" style={{ borderTop:'1px solid #241e16', paddingTop:11 }}>
      <summary className="mono" style={{ fontSize:10.5, letterSpacing:'.12em', color:'#8f8775', display:'flex', alignItems:'center', gap:7 }}>
        <span style={{ color:'#5FA8E6' }}>❝</span> COMMENTS {list.length ? '· ' + list.length : ''}
      </summary>
      <div style={{ marginTop:11, display:'flex', flexDirection:'column', gap:9 }}>
        {list.map(c => (
          <div key={c.id} style={{ fontSize:13, lineHeight:1.45, color:'#CFC8B9', background:'#0f0c08', border:'1px solid #241e16', borderRadius:5, padding:'8px 10px' }}>
            <div className="mono" style={{ fontSize:10, letterSpacing:'.08em', color:'#6e6757', marginBottom:4, display:'flex', justifyContent:'space-between' }}>
              <span style={{ color:'#5FA8E6' }}>{c.author || 'anon'}</span><span>{ago(c.ts)}</span>
            </div>
            {c.text}
          </div>
        ))}
        <div style={{ display:'flex', gap:7 }}>
          <input className="chip" style={{ flex:1, fontFamily:"'Archivo',sans-serif", fontSize:13, letterSpacing:0, color:'#E8E2D6', padding:'7px 9px' }}
            placeholder={author ? 'Add a comment…' : 'Set your name above to comment'}
            value={text} onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if(e.key === 'Enter') post(); }} />
          <button className="imgbtn" style={{ background:'#1f2733', borderColor:'#2d4254' }} onClick={post}>POST</button>
        </div>
      </div>
    </details>
  );
}

function Panel({ panel, siblings, author, requireName }){
  const mode = MODES[panel.mode] || MODES.void;
  const st = STATUS[panel.status] || STATUS.todo;
  const idx = siblings.findIndex(p => p.id === panel.id);
  const set = (patch) => store.update(panel.id, patch);

  const move = (dir) => {
    const target = siblings[idx + dir];
    if(!target) return;
    const a = panel.order, b = target.order;
    store.update(panel.id, { order: b });
    store.update(target.id, { order: a });
  };
  const cycleStatus = () => {
    const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(panel.status) + 1) % STATUS_CYCLE.length];
    set({ status: next });
  };
  const del = () => { if(confirm('Delete panel ' + panel.code + '?')) store.remove(panel.id); };

  return (
    <div className="card">
      <div style={{ height:4, width:'100%', background:mode.hex }}></div>
      <ImageArea panel={panel} />

      <div style={{ padding:'14px 18px 18px', display:'flex', flexDirection:'column', gap:13, flex:1 }}>
        {/* control row */}
        <div style={{ display:'flex', alignItems:'center', gap:7 }}>
          <button onClick={cycleStatus} className="mono" title="Click to change status"
            style={{ fontSize:10, letterSpacing:'.1em', padding:'5px 10px', borderRadius:4, cursor:'pointer', background:st.bg, color:st.hex, border:'1px solid '+st.hex+'66' }}>
            ● {st.label}
          </button>
          <select value={panel.mode} onChange={(e) => set({ mode: e.target.value })} className="mono"
            style={{ fontSize:10, letterSpacing:'.08em', padding:'5px 8px', borderRadius:4, background:'#1b1610', color:mode.hex, border:'1px solid '+mode.hex+'55', cursor:'pointer' }}>
            {Object.keys(MODES).map(k => <option key={k} value={k} style={{ background:'#15110c', color:'#E8E2D6' }}>{MODES[k].label}</option>)}
          </select>
          <div style={{ marginLeft:'auto', display:'flex', gap:5 }}>
            <button className="iconbtn" title="Move up"   onClick={() => move(-1)} disabled={idx === 0}>▲</button>
            <button className="iconbtn" title="Move down" onClick={() => move(1)} disabled={idx === siblings.length - 1}>▼</button>
            <button className="iconbtn" title="Delete panel" onClick={del} style={{ color:'#C97A5A' }}>✕</button>
          </div>
        </div>

        {/* meta chips */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:7 }}>
          <Chip value={panel.scene}   onCommit={(v) => set({ scene: v })} />
          <Chip value={panel.framing} onCommit={(v) => set({ framing: v })} />
          <Chip value={panel.camera}  onCommit={(v) => set({ camera: v })} />
        </div>

        {/* action */}
        <EditableText value={panel.action} onCommit={(v) => set({ action: v })} placeholder="Action / staging…"
          style={{ fontSize:14.5, lineHeight:1.55, color:'#D8D1C3' }} />

        {/* dialogue */}
        <div style={{ borderLeft:'3px solid #E8A24C', background:'linear-gradient(90deg,rgba(232,162,76,0.10),rgba(232,162,76,0.02))', padding:'8px 12px', borderRadius:'0 4px 4px 0' }}>
          <Chip value={panel.diaTag} onCommit={(v) => set({ diaTag: v })} />
          <div style={{ height:6 }}></div>
          <EditableText value={panel.diaLine} onCommit={(v) => set({ diaLine: v })} placeholder="Dialogue / V.O. (leave blank if none)…"
            style={{ fontSize:14, lineHeight:1.5, color:'#EDE6D8', fontStyle:'italic' }} />
        </div>

        {/* sound */}
        <div style={{ display:'flex', gap:9, alignItems:'flex-start' }}>
          <span className="mono" style={{ color:'#5a5346', flexShrink:0, letterSpacing:'.08em', fontSize:11.5, paddingTop:3 }}>SND</span>
          <EditableText value={panel.sound} onCommit={(v) => set({ sound: v })} placeholder="Sound design…"
            style={{ fontFamily:"'IBM Plex Mono',monospace", fontSize:11.5, lineHeight:1.5, color:'#8f8775' }} />
        </div>

        {/* prompt */}
        <div style={{ padding:'11px 13px', background:'#0f0c08', border:'1px solid #241e16', borderRadius:5 }}>
          <div className="mono" style={{ fontSize:9.5, letterSpacing:'.18em', color:'#5a5346', marginBottom:6, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span>▸ GENERATION PROMPT</span>
            <button className="imgbtn" style={{ padding:'3px 7px' }} onClick={() => { navigator.clipboard && navigator.clipboard.writeText(panel.prompt || ''); }}>COPY</button>
          </div>
          <EditableText value={panel.prompt} onCommit={(v) => set({ prompt: v })} placeholder="Generation prompt…"
            style={{ fontFamily:"'IBM Plex Mono',monospace", fontSize:11.5, lineHeight:1.55, color:'#B6AE9C' }} />
        </div>

        <Comments panel={panel} author={author} requireName={requireName} />
      </div>
    </div>
  );
}

function App(){
  const [panels, setPanels] = useState(null);
  const [author, setAuthor] = useAuthor();
  const [nameDraft, setNameDraft] = useState('');
  const live = store.mode === 'live';

  useEffect(() => {
    let unsub = () => {};
    store.seedIfEmpty(window.DEFAULT_PANELS).then(() => {
      unsub = store.subscribe(setPanels);
    });
    return () => unsub();
  }, []);

  const requireName = () => { const n = prompt('Enter a display name for your comments:'); if(n) setAuthor(n.trim()); };

  const addPanel = (section) => {
    const inSec = (panels || []).filter(p => p.section === section);
    const maxOrder = inSec.reduce((m, p) => Math.max(m, p.order || 0), 0);
    const def = SECTIONS.find(s => s.id === section);
    store.add({
      id: 'p-' + uid(), section, order: maxOrder + 10,
      code: 'NEW', scene: '', framing: '', camera: 'STATIC', mode: def ? def.defMode : 'amber',
      action: '', diaTag: '', diaLine: '', sound: '', prompt: '', status: 'todo', comments: []
    });
  };

  if(!panels) return (
    <div className="wrap mono" style={{ color:'#8c8474', paddingTop:120, textAlign:'center', letterSpacing:'.2em' }}>LOADING BOARD…</div>
  );

  const filled = panels.filter(p => p.image).length;
  const approved = panels.filter(p => p.status === 'approved').length;

  return (
    <div className="wrap">
      <header style={{ borderBottom:'1px solid #2c251b', paddingBottom:34, marginBottom:8 }}>
        <div className="mono" style={{ display:'flex', alignItems:'center', gap:12, fontSize:12, letterSpacing:'.22em', color:'#8c8474', textTransform:'uppercase', marginBottom:18, flexWrap:'wrap' }}>
          <span style={{ color:'#E8A24C' }}>●</span>
          <span>Episode 01 — Live Storyboard</span>
          <span style={{ color:'#4a4136' }}>/</span>
          <span style={{ color: live ? '#5FCF8E' : '#E8804C' }}>{live ? 'LIVE · SYNCED' : 'DEMO MODE · LOCAL'}</span>
        </div>
        <h1 style={{ fontSize:64, fontWeight:800, letterSpacing:'-0.02em', lineHeight:0.92, margin:'0 0 18px', textTransform:'uppercase' }}>The Keeper</h1>

        <div style={{ display:'flex', gap:'10px 26px', flexWrap:'wrap', alignItems:'center' }}>
          <div className="mono" style={{ fontSize:12, color:'#A39A88', display:'flex', gap:18, flexWrap:'wrap' }}>
            <span>{panels.length} PANELS</span>
            <span>{filled} FRAMES IN</span>
            <span>{approved} APPROVED</span>
          </div>
          <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
            <span className="mono" style={{ fontSize:11, color:'#6e6757', letterSpacing:'.1em' }}>YOU:</span>
            <input className="chip" style={{ fontFamily:"'Archivo',sans-serif", fontSize:13, color:'#E8E2D6', padding:'6px 10px', width:160 }}
              placeholder="your name" value={author || nameDraft}
              onChange={(e) => { setNameDraft(e.target.value); setAuthor(e.target.value); }} />
          </div>
        </div>
      </header>

      {!live &&
        <div className="banner" style={{ marginTop:30 }}>
          <span style={{ fontSize:18 }}>🛈</span>
          <div style={{ fontSize:13.5, lineHeight:1.55, color:'#Bcd0e0' }}>
            <strong style={{ color:'#9CC6EC' }}>Demo mode.</strong> Every change saves to this browser only — open a second tab to watch live sync locally.
            To make it a shared link your whole team edits together, paste your Firebase keys into <span className="mono" style={{ color:'#E8E2D6' }}>index.html</span> (see <span className="mono">SETUP.md</span>). The app flips to live automatically.
          </div>
        </div>}
      {live &&
        <div className="banner live" style={{ marginTop:30 }}>
          <span style={{ fontSize:18 }}>✓</span>
          <div style={{ fontSize:13.5, lineHeight:1.55, color:'#A8D9BE' }}>
            <strong style={{ color:'#7FE3A6' }}>Live & synced.</strong> Everyone with this URL edits the same board in real time. Changes appear within a second.
          </div>
        </div>}

      {SECTIONS.map(sec => {
        const sp = panels.filter(p => p.section === sec.id);
        return (
          <section key={sec.id} style={{ marginTop:56 }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:16, marginBottom:24, paddingBottom:14, borderBottom:'1px solid #2c251b', flexWrap:'wrap' }}>
              <div className="mono" style={{ fontSize:13, letterSpacing:'.18em', color:'#E8A24C' }}>{sec.kicker}</div>
              <h2 style={{ fontSize:26, fontWeight:700, letterSpacing:'-0.01em', margin:0 }}>{sec.title}</h2>
              <div className="mono" style={{ fontSize:12, color:'#6e6757', marginLeft:'auto' }}>{sec.scenes}</div>
            </div>
            <div className="grid">
              {sp.map(p => <Panel key={p.id} panel={p} siblings={sp} author={author} requireName={requireName} />)}
            </div>
            <button onClick={() => addPanel(sec.id)} className="mono"
              style={{ marginTop:18, fontSize:11.5, letterSpacing:'.1em', color:'#8c8474', background:'transparent', border:'1px dashed #3a3225', borderRadius:6, padding:'12px 18px', cursor:'pointer' }}>
              + ADD PANEL TO {sec.title.toUpperCase()}
            </button>
          </section>
        );
      })}

      <footer className="mono" style={{ marginTop:72, paddingTop:28, borderTop:'1px solid #2c251b', fontSize:11, letterSpacing:'.1em', color:'#5a5346', display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
        <span>THE KEEPER — EPISODE 01 — LIVE STORYBOARD</span>
        <span>{live ? 'FIRESTORE-SYNCED' : 'LOCAL DEMO'} · {panels.length} PANELS</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
